name: Firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  testes:
    name: Testes no computador
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-native-${{ hashFiles('firmware/platformio.ini') }}
      - name: Instalar PlatformIO
        run: pip install platformio
      - name: Rodar testes
        run: pio test -e native

  compilar:
    name: Compilar (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32s3, esp32s3-n16r8]
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-esp32-${{ hashFiles('firmware/platformio.ini') }}
      - name: Instalar PlatformIO
        run: pip install platformio
      - name: Compilar
        run: pio run -e ${{ matrix.env }}
      - name: Conferir a imagem do Wokwi
        if: matrix.env == 'esp32s3'
        run: |
          python -m esptool image_info .pio/build/esp32s3/firmware.bin | head -5 || true
          ls -l .pio/build/esp32s3/sabia-wokwi.bin .pio/build/esp32s3/firmware.bin
          # O programa começa em 0x10000 dentro da imagem e tem de ser idêntico ao firmware.bin.
          python - <<'PY'
          a = open(".pio/build/esp32s3/sabia-wokwi.bin", "rb").read()
          b = open(".pio/build/esp32s3/firmware.bin", "rb").read()
          assert a[0x10000:0x10000 + len(b)] == b, "programa fora do lugar na imagem"
          assert a[0x8000:0x8002] == b"\xaa\x50", "tabela de particoes ausente"
          print("imagem ok:", len(a), "bytes")
          PY
      - name: Guardar o firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            firmware/.pio/build/${{ matrix.env }}/firmware.bin
            firmware/.pio/build/${{ matrix.env }}/sabia-wokwi.bin
          if-no-files-found: error
          retention-days: 14
