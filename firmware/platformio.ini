; SABIÁ - configuração do PlatformIO
;
;   pio run -e esp32s3              compila para o Wokwi e placas S3 sem PSRAM octal
;   pio run -e esp32s3-n16r8 -t upload    grava na placa real (N16R8)
;   pio test -e native              roda os testes da lógica no computador
;   pio device monitor              abre o monitor serial

[platformio]
default_envs = esp32s3

[comum]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
  olikraus/U8g2@^2.35.30
  adafruit/RTClib@^2.1.4
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit BME280 Library@^2.2.4
; Compacta data/index.html e embute no firmware (include/pagina_gz.h)
extra_scripts = pre:embutir_pagina.py

; Usado pelo simulador Wokwi (ver wokwi.toml)
[env:esp32s3]
extends = comum
board = esp32-s3-devkitc-1
; No simulador a tela é um OLED SSD1306 (I2C) e o relógio é um DS1307,
; porque o Wokwi não tem o ST7920 nem o DS3231.
build_flags = ${comum.build_flags} -DSABIA_SIMULADOR
; O ESP32-S3 do Wokwi tem 4 MB de flash. "huge_app" cabe nisso e deixa 3 MB
; para o programa (sem atualização pela rede, que o simulador não usa).
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
; Imagem completa da flash (bootloader + partições + programa) para o Wokwi
extra_scripts = ${comum.extra_scripts}
  post:imagem_wokwi.py

; Placa real: 16 MB de flash e 8 MB de PSRAM octal
[env:esp32s3-n16r8]
extends = comum
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = ${comum.build_flags} -DBOARD_HAS_PSRAM

; Testes no computador, sem placa
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_deps = bblanchon/ArduinoJson@^7.2.0
