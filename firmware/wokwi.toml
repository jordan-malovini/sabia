[wokwi]
version = 1
# Imagem completa (bootloader + partições + programa), gerada por imagem_wokwi.py
firmware = '.pio/build/esp32s3/sabia-wokwi.bin'
elf = '.pio/build/esp32s3/firmware.elf'

# Página web no simulador: com a simulação rodando, abra http://localhost:8180
[[net.forward]]
from = "localhost:8180"
to = "target:80"
